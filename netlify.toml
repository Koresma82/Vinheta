# ============================================
# NETLIFY CONFIG - VINHETA
# MAIN  → PROD (Firebase: vinheta-3dd20)
# TEST  → TEST (Firebase: vinhetatest)
# DEV   → só local (Firebase: vinhetadev)
# ============================================

# --- PRODUÇÃO (branch: main) ---
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  VITE_ENVIRONMENT = "production"

# --- TEST (branch: test) ---
[context.test]
  command = "npm run build"
  publish = "dist"

[context.test.environment]
  VITE_ENVIRONMENT = "test"

# --- SPA redirect ---
[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude-proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
